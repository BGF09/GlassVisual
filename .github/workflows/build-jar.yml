name: Build NULL Fabric JAR

on:
  push:
    branches: [update/glassvisual-v1.1]
    paths:
      - 'GlassVisual/**'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: null-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build Fabric JAR
        working-directory: GlassVisual
        run: gradle build

      - name: Upload NULL JAR
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Fabric-JAR
          path: GlassVisual/build/libs/glass-visual-1.0.0.jar
          if-no-files-found: error
