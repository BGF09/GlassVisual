name: Build NULL Fabric JAR

on:
  push:
    branches: [update/glassvisual-v1.1, null-v1.1-build-2]
    paths:
      - 'GlassVisual/**'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: null-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric JAR
        working-directory: GlassVisual
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Verify JAR contents
        run: |
          JAR=GlassVisual/build/libs/glass-visual-1.2.0.jar
          unzip -l "$JAR" > jar-listing.txt
          cat jar-listing.txt
          for f in dev/glassvisual/NullModules.class dev/glassvisual/NullPlayerTrail.class \
                   dev/glassvisual/NullWorldParticles.class dev/glassvisual/NullVisualSettings.class \
                   dev/glassvisual/mixin/GameRendererMixin.class dev/glassvisual/ClickGuiScreen.class \
                   glassvisual.mixins.json fabric.mod.json assets/glassvisual/font/gui.json \
                   assets/glassvisual/font/inter-Regular.otf assets/glassvisual/font/inter-SemiBold.otf; do
            grep -q "$f" jar-listing.txt || { echo "MISSING IN JAR: $f"; exit 1; }
          done
          unzip -p "$JAR" glassvisual.mixins.json
          echo "JAR CONTENT CHECK OK"

      - name: Upload NULL JAR
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Fabric-JAR
          path: GlassVisual/build/libs/glass-visual-1.2.0.jar
          if-no-files-found: error
