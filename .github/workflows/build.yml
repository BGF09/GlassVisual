
name: Build Glass Visual

on:
  push:
    branches: [main, master, visual-finish, null-visual, feature/notifier-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build JAR
        working-directory: GlassVisual
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GlassVisual-JAR
          path: GlassVisual/build/libs/*.jar
