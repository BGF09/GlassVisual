name: Build NULL Launcher and Fabric Client

on:
  push:
    branches: [update/glassvisual-v1.1, null-v1.1-build-2]
    paths:
      - 'Apps/NullLauncher/**'
      - 'GlassVisual/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric mod
        working-directory: GlassVisual
        run: ./gradlew.bat build --stacktrace

      - name: Prepare embedded NULL JAR
        shell: pwsh
        run: |
          $jar = Get-ChildItem "GlassVisual/build/libs/glass-visual-*.jar" | Where-Object { $_.Name -notlike "*sources*" } | Select-Object -First 1
          if (-not $jar) { throw "NULL mod JAR was not produced" }
          New-Item -ItemType Directory -Force dist/mod | Out-Null
          Copy-Item $jar.FullName "Apps/NullLauncher/NULL.jar"
          Copy-Item $jar.FullName "dist/mod/NULL-Visual-1.2.0.jar"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate NULL Launcher icon
        run: |
          python -m pip install --quiet pillow
          python Apps/NullLauncher/create_icon.py

      - name: Publish standalone NULL Launcher.exe
        run: dotnet publish Apps/NullLauncher/NullLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/launcher

      - name: Upload standalone launcher
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Launcher-Windows
          path: dist/launcher/NULL-Launcher.exe
          if-no-files-found: error

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Fabric-JAR
          path: dist/mod/NULL-Visual-1.2.0.jar
          if-no-files-found: error
