name: Build NULL Client and Windows Apps

on:
  push:
    branches: [update/glassvisual-v1.1]
    paths:
      - 'Apps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build Fabric mod
        working-directory: GlassVisual
        run: gradle build

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate NULL Launcher icon
        run: |
          python -m pip install --quiet pillow
          python Apps/NullLauncher/create_icon.py

      - name: Publish NULL Installer.exe
        run: dotnet publish Apps/NullInstaller/NullInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/installer

      - name: Publish NULL Launcher.exe
        run: dotnet publish Apps/NullLauncher/NullLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/launcher

      - name: Collect JAR
        shell: pwsh
        run: |
          $jar = Get-ChildItem "GlassVisual/build/libs/glass-visual-1.0.0.jar" -ErrorAction Stop
          New-Item -ItemType Directory -Force dist/mod | Out-Null
          Copy-Item $jar.FullName dist/mod/NULL-Visual-1.0.0.jar

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Windows-EXE
          path: |
            dist/installer/NULL-Installer.exe
            dist/launcher/NULL-Launcher.exe
          if-no-files-found: error

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Fabric-JAR
          path: dist/mod/NULL-Visual-1.0.0.jar
          if-no-files-found: error
